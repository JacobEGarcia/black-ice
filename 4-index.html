<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACK ICE</title><style>*{box-sizing:border-box}body{margin:0;background:#03050a;color:#c9f9ff;font:14px ui-monospace,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;padding:22px;pointer-events:none}.top{display:flex;justify-content:space-between}.logo{font:900 clamp(35px,7vw,78px)/.8 sans-serif;letter-spacing:-.07em;color:#fff;text-shadow:4px 4px #f40078}.logo span{color:#42f5ff}.sub{color:#5eeeff;margin-top:12px;letter-spacing:.15em}.stats{text-align:right}.stats b{color:#ff3c91;font-size:21px}.target{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);text-align:center;width:min(700px,90%)}.word{font-size:clamp(36px,8vw,82px);font-weight:900;letter-spacing:.08em;text-shadow:0 0 18px #38edff}.word .hit{color:#ff368d}.prompt{color:#607b8e}.input{pointer-events:auto;position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:min(600px,85%);background:#060a12dd;border:1px solid #39e9ff;padding:14px;text-align:center;color:white;font:24px ui-monospace,monospace;outline:0;box-shadow:0 0 25px #00d9ff33}.message{position:absolute;left:22px;bottom:25px;color:#ff4b96}.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#0005 4px);mix-blend-mode:multiply}.start{position:fixed;inset:0;background:#03050aee;display:grid;place-items:center;text-align:center;z-index:4}.start button{border:2px solid #46efff;background:transparent;color:#46efff;font:20px ui-monospace;padding:14px 25px;cursor:pointer;box-shadow:0 0 20px #46efff55}.start p{color:#718797}.start.off{display:none}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div><div class="logo">BLACK<span>/ICE</span></div><div class="sub">NEO-TOKYO TYPING MASSACRE</div></div><div class="stats">INTEGRITY <b id="hp">100</b>%<br>COMBO <b id="combo">0</b><br>SCORE <b id="score">000000</b></div></div><div class="target"><div class="prompt" id="enemy">ICE DAEMON / LEVEL 01</div><div class="word" id="word">NEUROMANCER</div><div class="prompt">TYPE TO BURN THE ICE</div></div><input class="input" id="input" autocomplete="off" spellcheck="false" placeholder="begin typing…"><div class="message" id="msg">LINK STABLE // DON'T FLATLINE</div></div><div class="scan"></div><div class="start" id="start"><div><div class="logo">BLACK<span>/ICE</span></div><p>Type the hostile code before it reaches your nervous system.<br>Errors break combo. Speed is survival.</p><button id="go">JACK IN</button></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),words=['NEUROMANCER','FIREWALL','GHOSTCODE','SYNAPSE','RAZORGIRL','DATAVAULT','ICEBREAKER','CYBERDECK','FLATLINE','MIRRORSHADES','KUROMAKU','NIGHTCITY'];let cur=0,typed='',score=0,combo=0,hp=100,playing=false,t0=0,particles=[];const $=s=>document.querySelector(s);function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();function next(){cur=(cur+1)%words.length;typed='';$('#input').value='';t0=performance.now();$('#enemy').textContent='ICE DAEMON / LEVEL '+String(1+Math.floor(score/3000)).padStart(2,'0');show()}function show(){let w=words[cur];$('#word').innerHTML='<span class="hit">'+w.slice(0,typed.length)+'</span>'+w.slice(typed.length)}$('#go').onclick=()=>{$('#start').classList.add('off');playing=true;$('#input').focus();next()};$('#input').oninput=e=>{if(!playing)return;let v=e.target.value.toUpperCase(),w=words[cur];if(w.startsWith(v)){typed=v;show();if(v===w){let bonus=Math.max(100,800-Math.floor(performance.now()-t0));score+=bonus+combo*25;combo++;$('#combo').textContent=combo;$('#score').textContent=String(score).padStart(6,'0');for(let i=0;i<45;i++)particles.push({x:innerWidth/2,y:innerHeight*.62,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*10,l:1});next()}}else{combo=0;$('#combo').textContent=0;e.target.value=typed;hp=Math.max(0,hp-3);$('#hp').textContent=hp;$('#msg').textContent='INPUT REJECTED // NEURAL FEEDBACK';setTimeout(()=>$('#msg').textContent="LINK STABLE // DON'T FLATLINE",600)}};function draw(t){let w=innerWidth,h=innerHeight;x.fillStyle='#03050a';x.fillRect(0,0,w,h);x.strokeStyle='#10263b';x.lineWidth=1;let horizon=h*.48;for(let i=0;i<16;i++){let yy=horizon+(i*i)*2.5;x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke()}for(let i=-16;i<17;i++){x.beginPath();x.moveTo(w/2+i*55,h);x.lineTo(w/2+i*5,horizon);x.stroke()}for(let i=0;i<30;i++){let xx=(i*193+t*.04*(i%3+1))%(w+200)-100,hh=60+(i*37)%230;x.fillStyle=i%4?'#07101d':'#19071a';x.fillRect(xx,horizon-hh,40+(i*17)%90,hh);x.fillStyle=i%3?'#18dff0':'#f32983';x.fillRect(xx+8,horizon-hh+15,3,3)}let danger=(performance.now()-t0)/6000;if(playing&&danger>1){hp=Math.max(0,hp-.08);$('#hp').textContent=Math.ceil(hp);if(hp<=0){playing=false;$('#start').classList.remove('off');$('#go').textContent='RECONNECT';$('#start p').textContent='FLATLINED // SCORE '+score}}x.strokeStyle=`rgba(255,40,130,${.25+Math.min(1,danger)*.6})`;x.lineWidth=2;x.strokeRect(w*.2-danger*w*.12,h*.2-danger*h*.12,w*.6+danger*w*.24,h*.55+danger*h*.24);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.l-=.025;x.fillStyle=`rgba(65,239,255,${p.l})`;x.fillRect(p.x,p.y,4,4)});particles=particles.filter(p=>p.l>0);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></body></html>
